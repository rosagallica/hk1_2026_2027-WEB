<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form Payment</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/popper.min.js"></script>
    <script src="../js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="payment-box" style="max-width: 450px; margin: auto; border: 1px solid #8ec5ff;">
            <div class="checkout p-4" style="background-color: #f5faff;">
                <h5 class="mb-2">Checkout</h5>
                <hr class="my-0">
            
            <div class="row px-4">
                <div class="col-8"><strong>Product 1</strong></div>
                <div class="col-4 text-end">$200</div>
            </div>
            <small class="text-muted d-block px-4">Lorem ipsum dolor sit amet</small>

            <div class="row mt-3 px-4">
                <div class="col-8"><strong>Product 2</strong></div>
                <div class="col-4 text-end">$120</div>
            </div>
            <small class="text-muted d-block px-4">Lorem ipsum dolor sit amet</small>
            <hr class="mx-4">
            
            <div class="row mt-3 px-4">
                <div class="col-8"><strong>Total</strong></div>
                <div class="col-4 text-end">$320</div>
            </div>
        </div>
            <div class="card-details p-4" style="background-color: white;">
                <h5>Credit Card Details</h5>
                <hr>
                <div class="row">
                    <div class="col-6">
                        <label class="form-label" style="color: #666; font-size: 12px; margin-bottom: 5px;"><strong>CARD HOLDER</strong></label>
                        <input class="form-control" type="text" placeholder="Card Holder">
                    </div>
                    <div class="col-6">
                        <label class="form-label" style="color: #666; font-size: 12px; margin-bottom: 5px;"><strong>EXPIRATION DATE</strong></label>
                        <div class="row">
                            <div class="col-5">
                                <input type="text" class="form-control" placeholder="MM">
                            </div>
                            <div class="col-2 text-center">/</div>
                            <div class="col-5">
                                <input type="text" class="form-control" placeholder="YY">
                            </div>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-8">
                            <label class="form-label" style="color: #666; font-size: 12px; margin-bottom: 5px;"><strong>CARD NUMBER</strong></label>
                            <input type="text" class="form-control" placeholder="Card Number">
                        </div>
                        <div class="col-4">
                            <label class="form-label" style="color: #666; font-size: 12px; margin-bottom: 5px;"><strong>CVC</strong></label>
                            <input type="text" class="form-control" placeholder="CVC">
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="button" class="btn btn-primary">Proceed</button>
                    </div>
                </div>
            </div>            
        </div>
    </div>
</body>
</html>
