<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid Gallery</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/popper.min.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <script src="../js/jquery-4.0.0.min.js"></script>
    <style>
       .row {
    --bs-gutter-x: 0px;
    --bs-gutter-y: 0px;
}
    </style>    
</head>

<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-5" style="width: 435px;">
                <img src="../img/ảnh 3.jpg" class="img-fluid gallery-img" alt="image 3">
            </div>

            <div class="col-7">
                <div class="row">
                    <div class="col-6">
                        <img src="../img/ảnh 2.jpg" class="img-fluid gallery-img" alt="image 2">
                    </div>
                    <div class="col-6">
                        <img src="../img/ảnh 1.jpg" class="img-fluid gallery-img" alt="image 1">
                    </div>

                    <div class="row">
                        <div class="col-4">
                            <img src="../img/ảnh 4.jpg" class="img-fluid gallery-img" alt="image 4">
                        </div>
                        <div class="col-4">
                            <img src="../img/ảnh 5.jpg" class="img-fluid gallery-img" alt="image 5">
                        </div>
                        <div class="col-4">
                            <img src="../img/ảnh 6.jpg" class="img-fluid gallery-img" alt="image 6">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
