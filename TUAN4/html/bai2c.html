<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <script src="../js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <form action="" class="p-4">
    <div class="row px-4">
        <div class="col-6">
            <label for="" class="form-label">Username*</label>
            <input type="text" class="form-control" placeholder="Choose your username">
            <label for="" class="form-label mt-2">E-mail*</label>
            <input type="email" class="form-control" placeholder="Your current email address">
            <label for="" class="form-label mt-2">Password*</label>
            <input type="password" class="form-control" placeholder="Create a password">
            <label for="" class="form-label mt-2">Full name*</label>
            <input type="text" class="form-control" placeholder="Your First name and Last name">
            <div class="row mt-2">
                <label for="" class="form-label">Gender*</label>
                <div class="form-check mx-4">                
                <input type="radio" class="form-check-input" id="radio1" name="optradio" value="Male">Male       
            </div>
            <div class="form-check mx-4">                
                <input type="radio" class="form-check-input" id="radio1" name="optradio" value="female">Female       
            </div>
            </div>            
        </div>

        <div class="col-6">
            <label for="" class="form-label">Company name*</label>
            <input type="text" class="form-control" placeholder="your company username">
            <label for="" class="form-label mt-2">Category*</label>
            <input type="text" class="form-control" placeholder="skills catagory">
            <label for="" class="form-label mt-2">Contact number*</label>
            <input type="number" class="form-control" placeholder="provide your number">
            <label for="" class="form-label mt-2">Your Location*</label>
            <input type="text" class="form-control" placeholder="Your Pincode and City">
            <div class="form-check mt-2">
            <input class="form-check-input" type="checkbox" id="check1" name="option1" value="Agree with the terms and conditions" checked>
            <label class="form-check-label">Agree with the terms and conditions</label>
            </div>
            <div class="row mt-5">
                <div class="col-2">
                    <button type="button" class="btn btn-primary">Signup</button>
                </div>
                <div class="col-1 text-center">or</div>
                <div class="col-5">
                    <button type="button" class="btn btn-primary">Sign Up with Facebook</button>
                </div>
            </div> 
        </div>
    </div>
    </form>
</body>
</html>
