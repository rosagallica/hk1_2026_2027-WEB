<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feane - Order</title>
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <script src="../js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .modal-input {
      border: 1px solid #ffbe33;
      border-radius: 20px;
      padding: 8px 15px;
    }
    .modal-input:focus {
      border-color: #ffbe33;
      box-shadow: 0 0 0 0.2rem rgba(255, 190, 51, 0.25);
    }
  </style>
</head>
<body style="background-color: #222831; color: #fff;">

  <!-- Giao diện nền tương tự home.html -->
  <div class="hero-area">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
      <div class="container">
        <a class="navbar-brand font-handwriting fs-2 text-white" href="../html/home.html">Feane</a>
        <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navContent">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0 text-uppercase">
            <li class="nav-item"><a class="nav-link" href="../html/home.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="../html/menu.html">Menu</a></li>
            <li class="nav-item"><a class="nav-link" href="../html/about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="../html/book.html">Book Table</a></li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <a href="#" class="text-white"><i class="bi bi-person-fill"></i></a>
            <a href="#" class="text-white"><i class="bi bi-cart-fill"></i></a>
            <a href="#" class="text-white"><i class="bi bi-search"></i></a>
            <button class="btn btn-primary-custom rounded-pill px-4 py-2" data-bs-toggle="modal" data-bs-target="#orderModal">Order Online</button> <!--[cite: 3] -->
          </div>
        </div>
      </div>
    </nav>

    <!-- Nội dung Home -->
    <div class="container">
      <div class="hero-content">
        <h1 class="font-handwriting display-3 mb-3">Fast Food Restaurant</h1>
        <p class="text-light opacity-75 mb-4" style="line-height: 1.6; font-size: 14px;">
          Dolores, neque egestas facilisi torquent, commodo? Suspendisse ultrices elit sollicitudin quam quisque ornare nisi tellus. Sed tellus viverra justo, nec feugiat quis per id pulvinar libero augue.
        </p>
        <button class="btn btn-primary-custom rounded-pill px-4 py-2" data-bs-toggle="modal" data-bs-target="#orderModal">Order Now</button> <!--[cite: 3] -->
        
        <div class="d-flex gap-2 mt-5">
          <span class="rounded-circle" style="width: 10px; height: 10px; background-color: #ffbe33;"></span>
          <span class="rounded-circle bg-secondary" style="width: 10px; height: 10px;"></span>
          <span class="rounded-circle bg-secondary" style="width: 10px; height: 10px;"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- BOOTSTRAP MODAL -->
  <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-dark p-3">
        <!-- Header -->
        <div class="modal-header border-0 pb-0">
          <h3 class="modal-title font-handwriting text-warning" style="font-size: 32px;">Order</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <!-- Body Form -->
        <div class="modal-body">
          <form action="#" method="post">
            <div class="mb-3">
              <label class="form-label small fw-bold text-secondary">Telephone</label>
              <input type="tel" class="form-control modal-input" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold text-secondary">Email</label>
              <input type="email" class="form-control modal-input" required>
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="checkOut">
              <label class="form-check-label small text-secondary" for="checkOut">Check me out</label>
            </div>
            <!-- Footer Buttons -->
            <div class="d-flex justify-content-end gap-2">
              <button type="submit" class="btn btn-warning px-3 py-1 rounded text-white">Order</button>
              <button type="button" class="btn btn-primary-custom px-3 py-1 rounded" data-bs-dismiss="modal">Close</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
